name: Build BrewTap Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/xbloom-brewtap-apk", "feature/brewtap-premium-v11" ]
    paths: [ "xbloom-brewtap/**", ".github/workflows/xbloom-brewtap-android.yml" ]
  issues:
    types: [opened]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xbloom-brewtap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BrewTap-debug-apk
          path: xbloom-brewtap/app/build/outputs/apk/debug/app-debug.apk
